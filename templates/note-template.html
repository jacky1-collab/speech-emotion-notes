<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>論文簡短標題 — 語音情緒辨識文獻筆記</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="../../index.html" class="back-link">← 回首頁</a>
    </nav>

    <header class="note-header">
      <h1 id="paper-title">論文原文標題</h1>
      <p class="note-meta">發表年份：<span id="paper-year">2024</span></p>
    </header>

    <main>
      <section class="note-section">
        <h2>論文基本資料</h2>
        <ul class="meta-list">
          <li><strong>標題：</strong>論文原文標題</li>
          <li><strong>作者：</strong>作者姓名</li>
          <li><strong>年份：</strong>2024</li>
          <li><strong>來源：</strong>期刊或會議名稱</li>
          <li><strong>DOI 或連結：</strong><a href="https://doi.org/..." target="_blank" rel="noopener">https://doi.org/...</a></li>
        </ul>
      </section>

      <section class="note-section">
        <h2>一句摘要</h2>
        <p id="paper-summary">在此填寫一句摘要（不可含推測，不放具體結果數字）。</p>
      </section>

      <section class="note-section">
        <h2>研究問題</h2>
        <p>在此填寫研究問題。</p>
      </section>

      <section class="note-section">
        <h2>資料集</h2>
        <p>在此填寫資料集名稱、語言、情緒類別與樣本等資訊。</p>
      </section>

      <section class="note-section">
        <h2>方法</h2>
        <p>在此填寫特徵提取、模型架構與實驗設計。</p>
      </section>

      <section class="note-section">
        <h2>結果</h2>
        <p>在此填寫主要實驗成果與各項數據表現（數據請註明論文頁碼或圖表位置）。</p>
      </section>
    </main>
  </div>
</body>
</html>
